<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 199</title>
<style>
:root{
  --bg:#f7f7f9; --panel:#ffffff; --ink:#16161a; --ink2:#5a5a66; --ink3:#8b8b98;
  --line:#e6e6ec; --line2:#f0f0f4; --shadow:0 1px 3px rgba(20,20,35,.06),0 8px 28px rgba(20,20,35,.06);
  --nav:#ffffff; --navink:#3a3a46; --navactive:#f2f0ff;
  --c1:#4f46e5; --c2:#e11d48; --c3:#d97706; --c4:#0d9488; --c5:#7c3aed;
  --good:#059669; --bad:#dc2626; --grid:#eeeef3; --tip:#16161a; --tipink:#ffffff;
}
[data-theme="dark"]{
  --bg:#0e0e13; --panel:#17171f; --ink:#f2f2f7; --ink2:#a5a5b4; --ink3:#71717f;
  --line:#26262f; --line2:#1e1e26; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --nav:#14141b; --navink:#c8c8d4; --navactive:#221f3d;
  --c1:#818cf8; --c2:#fb7185; --c3:#fbbf24; --c4:#2dd4bf; --c5:#a78bfa;
  --good:#34d399; --bad:#f87171; --grid:#23232c; --tip:#f2f2f7; --tipink:#0e0e13;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}

/* ---------- layout ---------- */
.wrap{display:flex;min-height:100vh}
.nav{
  width:236px;flex:0 0 236px;background:var(--nav);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;gap:4px;
  position:sticky;top:0;height:100vh;transition:width .18s ease,flex-basis .18s ease;
}
body.collapsed .nav{width:66px;flex-basis:66px}
.navtop{display:flex;align-items:center;gap:10px;padding:0 8px 16px 10px}
.mark{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;
  background:linear-gradient(135deg,var(--c1),var(--c5));
  box-shadow:0 4px 14px color-mix(in srgb,var(--c1) 34%,transparent);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;
}
.navtitle{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
body.collapsed .navtitle{display:none}
.navbtn{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;border-radius:11px;
  color:var(--navink);font-size:14.5px;font-weight:500;text-align:left;white-space:nowrap;
}
.navbtn svg{flex:0 0 19px;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.navbtn:hover{background:var(--line2)}
.navbtn.on{background:var(--navactive);color:var(--c1);font-weight:600}
.navbtn.on svg{opacity:1}
body.collapsed .navbtn{justify-content:center;padding:12px 0}
body.collapsed .navbtn span{display:none}
.subnav{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px}
.subbtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px 10px 15px;
  border-radius:10px;color:var(--ink2);font-size:13px;font-weight:500;
  white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}
.subbtn .num{width:21px;height:21px;flex:0 0 21px;border-radius:6px;font-style:normal;
  background:color-mix(in srgb,var(--cc) 15%,transparent);color:var(--cc);
  font-size:11.5px;font-weight:700;display:grid;place-items:center}
.subbtn:hover{background:var(--line2)}
.subbtn.on{background:color-mix(in srgb,var(--cc) 11%,transparent);color:var(--cc);font-weight:600}
.subbtn.on .num{background:var(--cc);color:#fff}
body.collapsed .subbtn{justify-content:center;padding:10px 0}
body.collapsed .subbtn span{display:none}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:10px}
.main{flex:1;min-width:0;padding:26px 34px 70px}
@media(max-width:820px){
  .wrap{flex-direction:column}
  .nav{width:100%;flex-basis:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}
  body.collapsed .nav{width:100%;flex-basis:auto}
  .navtop{width:100%;padding-bottom:8px}
  .navbtn{width:auto}
  .navbtn span{display:inline!important}
  .subnav{flex-direction:row;flex-wrap:wrap;width:100%;margin:0}
  .subbtn{width:auto;padding:9px 12px}
  .subbtn span{display:inline!important}
  .navfoot{margin-top:0;flex-direction:row;width:100%}
  .main{padding:18px 16px 60px}
}

/* ---------- headers ---------- */
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:0 0 5px}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 20px;color:var(--ink)}
h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.stat .k{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3)}
.stat .v{font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--line2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tog{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);font-size:13.5px;color:var(--ink2);background:var(--panel)}
.tog.on{border-color:var(--c1);color:var(--c1);background:color-mix(in srgb,var(--c1) 8%,transparent);font-weight:600}
.swatch{width:11px;height:11px;border-radius:3px;background:currentColor;opacity:.9}

/* ---------- chart ---------- */
.chartbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 8px 6px}
#svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{
  position:absolute;pointer-events:none;background:var(--tip);color:var(--tipink);
  padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;white-space:nowrap;
  opacity:0;transition:opacity .1s;z-index:5;font-variant-numeric:tabular-nums;
  box-shadow:0 6px 22px rgba(0,0,0,.22)
}
.tip b{font-size:14px;font-weight:600}
.tip .dim{opacity:.65}

/* ---------- chapters ---------- */
.chaps{display:flex;flex-direction:column;gap:14px}
.chap{
  background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--cc);
  border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);
}
.chap .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;justify-content:space-between}
.chap .nm{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--cc)}
.chap .rng{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chap .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:14px;margin-top:14px}
.chap .nums div .k{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.chap .nums div .v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:7px;border-radius:4px;background:var(--line2);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--cc)}
.chap.future{border-style:dashed;border-left-style:solid}

/* ---------- milestones ---------- */
.mrow{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:none}
.mdot{width:13px;height:13px;flex:0 0 13px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 18%,transparent)}
.mrow .nm{font-size:15.5px;font-weight:600;flex:1;min-width:0}
.mrow .mdate{font-size:13.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mrow .wt{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:74px;text-align:right}

/* ---------- deadline ---------- */
.hero{
  border-radius:18px;padding:30px 32px;color:#fff;
  background:linear-gradient(135deg,var(--c5),var(--c1));
  box-shadow:0 10px 34px color-mix(in srgb,var(--c1) 30%,transparent);
}
.hero .lab{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;opacity:.8}
.hero .big{font-size:56px;font-weight:650;letter-spacing:-.04em;line-height:1.02;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:16px;opacity:.9;margin-top:8px;font-variant-numeric:tabular-nums}
.hero .track{margin-top:22px;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.hero .track i{display:block;height:100%;border-radius:6px;background:#fff}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;font-size:14px;font-weight:600;margin-top:16px}
.verdict.ok{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.verdict.no{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);padding:0 10px 10px 0;border-bottom:1px solid var(--line)}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line2);font-size:14px}
tr:last-child td{border-bottom:none}
.dl{display:inline-flex;align-items:center;gap:11px;padding:14px 20px;border-radius:13px;
  background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;font-weight:600;font-size:14.5px;
  box-shadow:0 6px 20px color-mix(in srgb,var(--c1) 30%,transparent)}
.dl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.range{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.dt{display:inline-flex;align-items:center;gap:9px;padding:7px 13px 7px 15px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;color:var(--ink3)}
.dt input{font:inherit;font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;
  color:var(--ink);background:none;border:none;outline:none;padding:4px 2px;color-scheme:light}
[data-theme="dark"] .dt input{color-scheme:dark}
.chap{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.chap:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(20,20,35,.07),0 14px 34px rgba(20,20,35,.09)}
.chap .see{font-size:12.5px;font-weight:600;color:var(--cc);opacity:.75;margin-top:12px}
.empty{padding:60px 20px;text-align:center;color:var(--ink3);font-size:14.5px}
.view{display:none}
.view.on{display:block}
.scroll{overflow-x:auto}
</style>
</head>

<div class="wrap">

<nav class="nav">
  <div class="navtop">
    <button class="mark" id="collapse" title="Collapse">199</button>
    <div class="navtitle">Project 199</div>
  </div>

  <button class="navbtn on" data-go="chart"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg><span>Chart</span></button>
  <button class="navbtn" data-go="chapters"><svg viewBox="0 0 24 24"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h10"/></svg><span>Chapters</span></button>
  <div class="subnav" id="chapnav"></div>
  <button class="navbtn" data-go="milestones"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h12l-2.5 3.5L17 12H5"/></svg><span>Milestones</span></button>
  <button class="navbtn" data-go="deadline"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg><span>September 30</span></button>
  <button class="navbtn" data-go="data"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg><span>Data</span></button>

  <div class="navfoot">
    <button class="navbtn" id="theme"><svg viewBox="0 0 24 24" id="themeicon"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg><span id="themelabel">Dark</span></button>
  </div>
</nav>

<main class="main">

<!-- CHART -->
<section class="view on" id="v-chart">
  <p class="eyebrow">Dan Faber</p>
  <h1 id="charttitle">Weight</h1>
  <div class="stats" id="topstats"></div>
  <div class="controls">
    <div class="seg" id="grain">
      <button data-g="day" class="on">Day</button>
      <button data-g="week">Week</button>
      <button data-g="month">Month</button>
    </div>
    <button class="tog on" id="tChap"><i class="swatch"></i>Chapters</button>
    <button class="tog on" id="tMile"><i class="swatch"></i>Milestones</button>
    <button class="tog on" id="tPace"><i class="swatch"></i>Pace to 200</button>
  </div>
  <div class="range">
    <div class="seg" id="preset">
      <button data-p="all" class="on">All time</button>
      <button data-p="90">90 days</button>
      <button data-p="30">30 days</button>
    </div>
    <label class="dt">From<input type="date" id="from"></label>
    <label class="dt">To<input type="date" id="to"></label>
  </div>
  <div class="chartbox">
    <svg id="svg" viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tip" id="tip"></div>
  </div>
</section>

<!-- CHAPTERS -->
<section class="view" id="v-chapters">
  <p class="eyebrow">Dan Faber</p>
  <h1>Chapters</h1>
  <div class="chaps" id="chaplist"></div>
</section>

<!-- MILESTONES -->
<section class="view" id="v-milestones">
  <p class="eyebrow">Dan Faber</p>
  <h1>Milestones</h1>
  <div class="card" id="milelist"></div>
</section>

<!-- DEADLINE -->
<section class="view" id="v-deadline">
  <p class="eyebrow">Dan Faber</p>
  <h1>September 30</h1>
  <div class="hero" id="hero"></div>
  <div class="pace" id="pacestats"></div>
  <div id="verdictwrap"></div>
  <h2 style="margin-top:28px">Weekly checkpoints</h2>
  <div class="card scroll"><table id="ladder"></table></div>
</section>

<!-- DATA -->
<section class="view" id="v-data">
  <p class="eyebrow">Dan Faber</p>
  <h1>Data</h1>
  <div class="card">
    <div id="datarange" style="font-size:13.5px;color:var(--ink3);margin-bottom:14px"></div>
    <button class="dl" id="dlcsv"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>Download CSV</button>
    <div style="margin-top:22px" class="scroll"><table id="datatable"></table></div>
  </div>
</section>

</main>
</div>

const GOAL = { date:"2026-09-30", weight:200, start:"2025-10-12", startWeight:240 };

/* ---- Milestones: add a line here to add one ---- */

  { d:"2025-10-12", n:"Goal Set",       c:"var(--c1)" },
  { d:"2026-03-04", n:"Kailey Surgery", c:"var(--c2)" },
  { d:"2026-04-27", n:"Mastermind",     c:"var(--c3)" },
  { d:"2026-06-03", n:"Lacrosse",       c:"var(--c4)" },
  { d:"2026-09-30", n:"Deadline",       c:"var(--c5)" }
];

/* ---- Chapters: end "" means "runs to the latest weigh-in" ---- */
const CHAPS = [
  { n:"Goal set to first low",  s:"Descent",    a:"2025-10-12", b:"2026-03-01", c:"var(--c1)" },
  { n:"Surgery and recovery",   s:"Surgery",    a:"2026-03-01", b:"2026-04-27", c:"var(--c2)" },
  { n:"Mastermind to lacrosse", s:"Mastermind", a:"2026-04-27", b:"2026-06-03", c:"var(--c3)" },
  { n:"Lacrosse season",        s:"Lacrosse",   a:"2026-06-03", b:"",           c:"var(--c4)" },
  { n:"Run to September 30",    s:"The run",    a:"",           b:"2026-09-30", c:"var(--c5)", future:true }
];

/* ============================ helpers ============================ */
const D = s => { const p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); };
const iso = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { const d=D(s); return MON[d.getMonth()]+" "+d.getDate(); };
const fmtY = s => { const d=D(s); return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); };
const days = (a,b) => Math.round((D(b)-D(a))/864e5);
const shift = (s,n) => iso(new Date(D(s).getTime()+n*864e5));
const n1 = v => (v==null?"—":(Math.round(v*10)/10).toFixed(1));
const sgn = v => (v>0?"+":"")+n1(v);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const clampDate = s => s<GOAL.start?GOAL.start:(s>GOAL.date?GOAL.date:s);

const SERIES = ROWS.map(r => ({ d:r[0], w:r[1] }));
const LAST = SERIES[SERIES.length-1];

/* Monday that starts the week containing d */
function monday(dt){ const x=new Date(dt); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }

/* ============================ state ============================ */
let grain="day";
let show={chap:true, mile:true, pace:true};
let FROM=GOAL.start, TO=GOAL.date;

const inRange = () => SERIES.filter(r => r.d>=FROM && r.d<=TO);

function bucket(g){
  const pts=inRange();
  if(g==="day") return pts.map(r => ({ d:r.d, v:r.w, n:1, lo:r.w, hi:r.w }));
  const map=new Map();
  for(const r of pts){
    const k = g==="week" ? iso(monday(D(r.d))) : r.d.slice(0,7)+"-01";
    if(!map.has(k)) map.set(k,[]);
    map.get(k).push(r.w);
  }
  return [...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([k,vs]) => ({
    d:k, v:vs.reduce((s,x)=>s+x,0)/vs.length, n:vs.length, lo:Math.min(...vs), hi:Math.max(...vs)
  }));
}

function nearestAt(dstr){
  let best=null, bd=1e9;
  for(const r of SERIES){ const g=Math.abs(days(r.d,dstr)); if(g<bd){bd=g;best=r;} }
  return { row:best, gap:bd };
}

/* ============================ chart ============================ */
const svg=document.getElementById("svg"), tip=document.getElementById("tip");
const W=1000,H=460,M={t:34,r:26,b:44,l:52};
const PW=W-M.l-M.r, PH=H-M.t-M.b;
let PLOT=[];

function draw(){
  const pts=bucket(grain);
  const x0=D(FROM).getTime(), x1=D(TO).getTime();
  const span=Math.max(1,days(FROM,TO));
  const X = t => M.l + ((t-x0)/(x1-x0))*PW;

  if(!pts.length){
    svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="15" fill="var(--ink3)">No weigh-ins in this range</text>`;
    PLOT=[]; return;
  }

  /* y domain — pull in the 200 line only when it matters to this window */
  let vals=pts.map(p=>p.v);
  const paceOn = show.pace && TO>=LAST.d;
  if(TO>=GOAL.date || Math.min(...vals)<=GOAL.weight+6) vals=vals.concat([GOAL.weight]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi-lo<1.5){ const m=(hi+lo)/2; lo=m-1.5; hi=m+1.5; }
  const pad=(hi-lo)*0.10; lo-=pad; hi+=pad;
  const Y = v => M.t + PH - ((v-lo)/(hi-lo))*PH;

  let head='', body='', foot='';
  head+=`<defs>
    <clipPath id="clip"><rect x="${M.l}" y="${M.t}" width="${PW}" height="${PH}"/></clipPath>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--c1)" stop-opacity=".22"/>
      <stop offset="100%" stop-color="var(--c1)" stop-opacity="0"/></linearGradient>
  </defs>`;

  /* chapter bands (clipped) with labels clamped to the visible plot */
  if(show.chap){
    CHAPS.forEach(ch=>{
      const a=ch.a||LAST.d, b=ch.b||LAST.d;
      if(b<FROM||a>TO) return;
      const xa=X(D(a).getTime()), xb=X(D(b).getTime());
      body+=`<rect x="${xa}" y="${M.t}" width="${Math.max(0,xb-xa)}" height="${PH}" fill="${ch.c}" opacity="${ch.future?.05:.075}"/>`;
      body+=`<line x1="${xa}" y1="${M.t}" x2="${xa}" y2="${M.t+PH}" stroke="${ch.c}" stroke-width="1" opacity=".3"/>`;
      const va=clamp(xa,M.l,M.l+PW), vb=clamp(xb,M.l,M.l+PW);
      const room=vb-va-8, mid=(va+vb)/2;
      const txt = (ch.n.length*6.15<=room) ? ch.n : ((ch.s.length*6.15<=room) ? ch.s : "");
      if(txt) foot+=`<text x="${mid}" y="${M.t-13}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${ch.c}" opacity=".85">${txt}</text>`;
    });
  }

  /* y gridlines */
  for(let i=0;i<=6;i++){
    const v=lo+(hi-lo)*i/6, y=Y(v);
    head+=`<line x1="${M.l}" y1="${y}" x2="${M.l+PW}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    head+=`<text x="${M.l-10}" y="${y+4}" text-anchor="end" font-size="11.5" fill="var(--ink3)">${v.toFixed(hi-lo<12?1:0)}</text>`;
  }

  /* x ticks — spacing follows the length of the window */
  const xt=[];
  if(span<=26){
    let c=D(FROM); const st=span<=12?1:3;
    while(c<=D(TO)){ xt.push([new Date(c),fmt(iso(c))]); c=new Date(c.getTime()+st*864e5); }
  } else if(span<=100){
    let c=monday(D(FROM)); if(c<D(FROM)) c=new Date(c.getTime()+7*864e5);
    while(c<=D(TO)){ xt.push([new Date(c),fmt(iso(c))]); c=new Date(c.getTime()+7*864e5); }
  } else {
    let c=new Date(D(FROM).getFullYear(),D(FROM).getMonth(),1);
    while(c<=D(TO)){
      if(c>=D(FROM)) xt.push([new Date(c), MON[c.getMonth()]+(c.getMonth()===0?" '"+String(c.getFullYear()).slice(2):"")]);
      c=new Date(c.getFullYear(),c.getMonth()+1,1);
    }
  }
  const step=Math.max(1,Math.ceil(xt.length/14));
  xt.forEach(([c,lab],i)=>{
    if(i%step) return;
    const x=X(c.getTime());
    head+=`<line x1="${x}" y1="${M.t}" x2="${x}" y2="${M.t+PH}" stroke="var(--grid)" stroke-width="1" opacity=".7"/>`;
    head+=`<text x="${x}" y="${M.t+PH+22}" text-anchor="middle" font-size="11.5" fill="var(--ink3)">${lab}</text>`;
  });

  /* goal line + pace to 200 */
  if(GOAL.weight>=lo && GOAL.weight<=hi){
    const yg=Y(GOAL.weight);
    body+=`<line x1="${M.l}" y1="${yg}" x2="${M.l+PW}" y2="${yg}" stroke="var(--c5)" stroke-width="2" stroke-dasharray="2 6" opacity=".75"/>`;
    foot+=`<text x="${M.l+PW}" y="${yg-9}" text-anchor="end" font-size="12" font-weight="600" fill="var(--c5)">200 lb</text>`;
  }
  if(paceOn){
    const lx=X(D(LAST.d).getTime()), ly=Y(LAST.w);
    const gx=X(D(GOAL.date).getTime()), gy=Y(GOAL.weight-0.1);
    body+=`<line x1="${lx}" y1="${ly}" x2="${gx}" y2="${gy}" stroke="var(--c5)" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>`;
    body+=`<circle cx="${gx}" cy="${gy}" r="6" fill="var(--c5)"/><circle cx="${gx}" cy="${gy}" r="11" fill="var(--c5)" opacity=".22"/>`;
  }

  /* the line */
  const P=pts.map(p=>({x:X(D(p.d).getTime()), y:Y(p.v), p}));
  PLOT=P;
  const path=P.map((q,i)=>(i?"L":"M")+q.x.toFixed(1)+" "+q.y.toFixed(1)).join(" ");
  body+=`<path d="${path} L ${P[P.length-1].x.toFixed(1)} ${M.t+PH} L ${P[0].x.toFixed(1)} ${M.t+PH} Z" fill="url(#ag)"/>`;
  body+=`<path d="${path}" fill="none" stroke="var(--c1)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  const r = P.length>140?2.1:(P.length>50?3.2:4.6);
  P.forEach(q=>{ body+=`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${r}" fill="var(--panel)" stroke="var(--c1)" stroke-width="1.7"/>`; });
  const l=P[P.length-1];
  body+=`<circle cx="${l.x}" cy="${l.y}" r="6" fill="var(--c1)"/><circle cx="${l.x}" cy="${l.y}" r="12" fill="var(--c1)" opacity=".2"/>`;

  /* milestones */
  if(show.mile){
    MILES.forEach(m=>{
      if(m.d<FROM||m.d>TO) return;
      const x=X(D(m.d).getTime());
      body+=`<line x1="${x}" y1="${M.t+14}" x2="${x}" y2="${M.t+PH}" stroke="${m.c}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/>`;
      body+=`<circle cx="${x}" cy="${M.t+14}" r="4.5" fill="${m.c}"/>`;
      const half=m.n.length*3.1;
      foot+=`<text x="${clamp(x,half+2,W-half-2)}" y="${M.t+PH+38}" text-anchor="middle" font-size="11" font-weight="600" fill="${m.c}">${m.n}</text>`;
    });
  }

  foot+=`<rect x="${M.l}" y="${M.t}" width="${PW}" height="${PH}" fill="transparent"/>`;
  foot+=`<line id="cross" x1="0" y1="${M.t}" x2="0" y2="${M.t+PH}" stroke="var(--ink3)" stroke-width="1" opacity="0"/>`;
  foot+=`<circle id="dot" r="5.5" fill="var(--c1)" stroke="var(--panel)" stroke-width="2" opacity="0"/>`;

  svg.innerHTML = head + `<g clip-path="url(#clip)">${body}</g>` + foot;
  wireHover();
}

function wireHover(){
  const cross=svg.querySelector("#cross"), dot=svg.querySelector("#dot");
  function move(e){
    if(!PLOT.length) return;
    const r=svg.getBoundingClientRect();
    const cx=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W;
    let best=null,bd=1e9;
    for(const q of PLOT){ const d=Math.abs(q.x-cx); if(d<bd){bd=d;best=q;} }
    if(!best) return;
    cross.setAttribute("x1",best.x); cross.setAttribute("x2",best.x); cross.setAttribute("opacity",".28");
    dot.setAttribute("cx",best.x); dot.setAttribute("cy",best.y); dot.setAttribute("opacity","1");
    const p=best.p;
    const label = grain==="month" ? MON[D(p.d).getMonth()]+" "+D(p.d).getFullYear()
                : grain==="week" ? "Week of "+fmt(p.d) : fmtY(p.d);
    let extra;
    if(p.n>1) extra=`<div class="dim">${p.n} weigh-ins · ${n1(p.lo)}–${n1(p.hi)}</div>`;
    else { const g=p.v-GOAL.weight; extra=`<div class="dim">${g>0?n1(g)+" lb above 200":n1(-g)+" lb below 200"}</div>`; }
    tip.innerHTML=`<b>${n1(p.v)} lb</b><div class="dim">${label}</div>${extra}`;
    tip.style.opacity="1";
    const bx=best.x/W*r.width, by=best.y/H*r.height;
    tip.style.left=clamp(bx-tip.offsetWidth/2,4,r.width-tip.offsetWidth-4)+"px";
    tip.style.top=Math.max(by-tip.offsetHeight-16,2)+"px";
  }
  function out(){ tip.style.opacity="0"; cross.setAttribute("opacity","0"); dot.setAttribute("opacity","0"); }
  svg.onmousemove=move; svg.onmouseleave=out;
  svg.ontouchstart=move; svg.ontouchmove=move; svg.ontouchend=out;
}

/* ============================ range control ============================ */
const iFrom=document.getElementById("from"), iTo=document.getElementById("to");
iFrom.min=iTo.min=GOAL.start; iFrom.max=iTo.max=GOAL.date;

function setRange(f,t,preset){
  FROM=clampDate(f); TO=clampDate(t);
  if(FROM>TO) TO=FROM;
  iFrom.value=FROM; iTo.value=TO;
  document.querySelectorAll("#preset button").forEach(b=>b.classList.toggle("on", b.dataset.p===preset));
  syncChapNav();
  topStats(); draw(); datatable();
}
document.querySelectorAll("#preset button").forEach(b=>b.onclick=()=>{
  const p=b.dataset.p;
  if(p==="all") setRange(GOAL.start,GOAL.date,"all");
  else setRange(shift(LAST.d,-(+p)),LAST.d,p);
});
/* moving one end past the other drags that end along, it never swaps them */
iFrom.onchange=()=>{ const f=clampDate(iFrom.value||GOAL.start); setRange(f, f>TO?f:TO, null); };
iTo.onchange=()=>{ const t=clampDate(iTo.value||GOAL.date); setRange(t<FROM?t:FROM, t, null); };

/* ============================ top stats ============================ */
/* every card reads off the selected window, not the whole project */
function topStats(){
  const rows=inRange(), el=document.getElementById("topstats");
  const chap=CHAPS.filter(c=>!c.future).find(c=>(c.a||LAST.d)===FROM && (c.b||LAST.d)===TO);
  document.getElementById("charttitle").textContent = chap ? chap.n : "Weight";

  if(!rows.length){
    el.innerHTML=`<div class="stat"><div class="k">Weigh-ins</div><div class="v">0</div><div class="s">none in this range</div></div>`;
    return;
  }
  const a=rows[0], b=rows[rows.length-1];
  const chg=b.w-a.w, dl=Math.max(1,days(a.d,b.d));
  const low=rows.reduce((x,y)=>y.w<x.w?y:x);
  const togo=b.w-GOAL.weight;
  const live=TO>=LAST.d;
  const col = chg<0?"var(--good)":chg>0?"var(--bad)":"var(--ink)";
  el.innerHTML=`
    <div class="stat"><div class="k">${live?"Now":"End"}</div><div class="v">${n1(b.w)}</div><div class="s">${fmtY(b.d)}</div></div>
    <div class="stat"><div class="k">Start</div><div class="v">${n1(a.w)}</div><div class="s">${fmtY(a.d)}</div></div>
    <div class="stat"><div class="k">${chg<=0?"Lost":"Gained"}</div><div class="v" style="color:${col}">${n1(Math.abs(chg))}</div><div class="s">${sgn(chg/(dl/7))} lb per week</div></div>
    <div class="stat"><div class="k">To 200</div><div class="v" style="color:${togo>0?"var(--c5)":"var(--good)"}">${n1(Math.abs(togo))}</div><div class="s">${togo>0?"still to lose":"under goal"}</div></div>
    <div class="stat"><div class="k">Lowest</div><div class="v">${n1(low.w)}</div><div class="s">${fmtY(low.d)}</div></div>`;
}

          <div><div class="k">To</div><div class="v">under 200</div></div>
          <div><div class="k">To lose</div><div class="v">${n1(need)}</div></div>
          <div><div class="k">Days</div><div class="v">${dl}</div></div>
          <div><div class="k">Per week</div><div class="v">${n1(need/(dl/7))}</div></div>
        </div>
        <div class="see">Show on chart</div></div>`;
    }
    const rows=SERIES.filter(r=>r.d>=a&&r.d<=b);
    if(!rows.length) return "";
    const s0=rows[0], s1=rows[rows.length-1];
    const chg=s1.w-s0.w, dl=Math.max(1,days(s0.d,s1.d));
    const lo=rows.reduce((x,y)=>y.w<x.w?y:x), hi=rows.reduce((x,y)=>y.w>x.w?y:x);
    const pct=clamp((GOAL.startWeight-s1.w)/(GOAL.startWeight-GOAL.weight)*100,0,100);
    const col = chg<0?"var(--good)":"var(--bad)";
    return `<div class="chap" data-ch="${i}" style="--cc:${ch.c}">
      <div class="top"><div class="nm">${ch.n}</div><div class="rng">${fmt(a)} — ${fmtY(b)} · ${dl} days</div></div>
      <div class="nums">
        <div><div class="k">Start</div><div class="v">${n1(s0.w)}</div></div>
        <div><div class="k">End</div><div class="v">${n1(s1.w)}</div></div>
        <div><div class="k">Change</div><div class="v" style="color:${col}">${sgn(chg)}</div></div>
        <div><div class="k">Per week</div><div class="v" style="color:${col}">${sgn(chg/(dl/7))}</div></div>
        <div><div class="k">Range</div><div class="v">${n1(lo.w)}–${n1(hi.w)}</div></div>
        <div><div class="k">Weigh-ins</div><div class="v">${rows.length}</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="see">Show on chart</div></div>`;
  }).join("");
  document.querySelectorAll(".chap").forEach(el=>el.onclick=()=>{
    const ch=CHAPS[+el.dataset.ch];
    setRange(ch.a||LAST.d, ch.b||LAST.d, null);
    go("chart");
  });
}

/* ============================ milestones ============================ */
function milestones(){
  document.getElementById("milelist").innerHTML=MILES.map(m=>{
    const future = D(m.d)>D(LAST.d);
    const near=nearestAt(m.d);
    const wt = future ? "under 200" : n1(near.row.w);
    const note = future ? "target" : (near.gap===0 ? "" : "nearest weigh-in "+fmt(near.row.d));
    return `<div class="mrow" style="--mc:${m.c}">
      <i class="mdot"></i>
      <div class="nm">${m.n}${note?`<div style="font-size:12.5px;font-weight:400;color:var(--ink3)">${note}</div>`:""}</div>
      <div class="mdate">${fmtY(m.d)}</div>
      <div class="wt" style="color:${m.c}">${wt}</div>
    </div>`;
  }).join("");
}

/* ============================ deadline ============================ */
function deadline(){
  const today=new Date(); today.setHours(0,0,0,0);
  const tISO=iso(today), gd=D(GOAL.date);
  const left=Math.max(0,Math.round((gd-today)/864e5));
  const need=LAST.w-(GOAL.weight-0.1);
  const perWk=left>0?need/(left/7):0, perDay=left>0?need/left:0;
  const done=clamp((GOAL.startWeight-LAST.w)/(GOAL.startWeight-GOAL.weight)*100,0,100);

  document.getElementById("hero").innerHTML=`
    <div class="lab">Days to September 30</div>
    <div class="big">${left}</div>
    <div class="sub">${n1(LAST.w)} lb today · ${n1(need)} lb to go</div>
    <div class="track"><i style="width:${done}%"></i></div>
    <div class="sub" style="font-size:13.5px;margin-top:9px">${n1(done)}% of the way from 240 to 200</div>`;

  const totDays=days(GOAL.start,GOAL.date);
  const elapsed=clamp(days(GOAL.start,tISO),0,totDays);
  const onLine=GOAL.startWeight-(GOAL.startWeight-GOAL.weight)*(elapsed/totDays);
  const delta=LAST.w-onLine;

  document.getElementById("pacestats").innerHTML=`
    <div class="stat"><div class="k">Needed per week</div><div class="v">${n1(perWk)}</div><div class="s">lb</div></div>
    <div class="stat"><div class="k">Needed per day</div><div class="v">${n1(perDay)}</div><div class="s">lb</div></div>
    <div class="stat"><div class="k">Straight-line target today</div><div class="v">${n1(onLine)}</div><div class="s">lb</div></div>
    <div class="stat"><div class="k">Best pace so far</div><div class="v">${n1(bestStretch())}</div><div class="s">lb/week over 4 weeks</div></div>`;

  const ok=delta<=0;
  document.getElementById("verdictwrap").innerHTML=
    `<div class="verdict ${ok?"ok":"no"}">${ok?"Ahead of the straight line by "+n1(-delta)+" lb":"Behind the straight line by "+n1(delta)+" lb"}</div>`;

  let rows="<tr><th>Week of</th><th>Target</th><th>Cumulative loss</th><th>Actual</th></tr>";
  let m=monday(today); if(m<today) m=new Date(m.getTime()+7*864e5);
  const stops=[]; let cur=new Date(m);
  while(cur<=gd){ stops.push(new Date(cur)); cur=new Date(cur.getTime()+7*864e5); }
  if(!stops.length||iso(stops[stops.length-1])!==GOAL.date) stops.push(gd);
  const startW=LAST.w, spanD=Math.max(1,Math.round((gd-today)/864e5));
  stops.forEach(st=>{
    const e=Math.round((st-today)/864e5);
    const tgt=startW-(need*Math.min(1,e/spanD));
    const act=SERIES.find(r=>r.d===iso(st));
    rows+=`<tr><td>${fmt(iso(st))}</td><td><b>${n1(tgt)}</b></td><td>${n1(startW-tgt)}</td><td style="color:var(--ink3)">${act?n1(act.w):"—"}</td></tr>`;
  });
  document.getElementById("ladder").innerHTML=rows;
}

function bestStretch(){
  let best=0;
  for(let i=0;i<SERIES.length;i++)
    for(let j=i+1;j<SERIES.length;j++){
      const dl=days(SERIES[i].d,SERIES[j].d);
      if(dl<26) continue;
      if(dl>30) break;
      const rate=(SERIES[i].w-SERIES[j].w)/(dl/7);
      if(rate>best) best=rate;
    }
  return best;
}

/* ============================ data table ============================ */
function datatable(){
  const rows=inRange();
  document.getElementById("datarange").textContent =
    rows.length ? `${fmtY(FROM)} — ${fmtY(TO)} · ${rows.length} weigh-ins` : "No weigh-ins in this range";
  let h="<tr><th>Date</th><th>Weight</th><th>Change</th><th>vs 200</th></tr>";
  const rev=[...rows].reverse();
  rev.forEach((r,i)=>{
    const prev=rev[i+1];
    const dw=prev?r.w-prev.w:null;
    const g=r.w-GOAL.weight;
    h+=`<tr><td>${fmtY(r.d)}</td><td><b>${n1(r.w)}</b></td>
        <td style="color:${dw==null?"var(--ink3)":dw<0?"var(--good)":dw>0?"var(--bad)":"var(--ink3)"}">${dw==null?"—":sgn(dw)}</td>
        <td style="color:${g>0?"var(--ink3)":"var(--good)"}">${sgn(g)}</td></tr>`;
  });
  document.getElementById("datatable").innerHTML=h;
}
document.getElementById("dlcsv").onclick=()=>{
  const csv="Date,Weight(lb)\n"+inRange().map(r=>r.d+","+r.w).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`project-199-weight_${FROM}_to_${TO}.csv`; a.click();
};

/* ============================ nav / theme / routing ============================ */
function go(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id==="v-"+id));
  document.querySelectorAll(".navbtn[data-go]").forEach(b=>b.classList.toggle("on", b.dataset.go===id));
  if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
  if(id==="chart") draw();
  window.scrollTo(0,0);
}
document.querySelectorAll(".navbtn[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(document.getElementById("v-"+h)) go(h);});

const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

const SUN='<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>';
const MOON='<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>';
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  document.getElementById("themeicon").innerHTML = t==="dark"?SUN:MOON;
  document.getElementById("themelabel").textContent = t==="dark"?"Light":"Dark";
  store.set("p199-theme",t);
  draw();
}
document.getElementById("theme").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
document.getElementById("collapse").onclick=()=>{
  document.body.classList.toggle("collapsed");
  store.set("p199-nav", document.body.classList.contains("collapsed")?"1":"0");
};
document.querySelectorAll("#grain button").forEach(b=>b.onclick=()=>{
  grain=b.dataset.g;
  document.querySelectorAll("#grain button").forEach(x=>x.classList.toggle("on",x===b));
  draw();
});
[["tChap","chap"],["tMile","mile"],["tPace","pace"]].forEach(([id,k])=>{
  document.getElementById(id).onclick=()=>{
    show[k]=!show[k];
    document.getElementById(id).classList.toggle("on",show[k]);
    draw();
  };
});

/* ============================ init ============================ */
iFrom.value=FROM; iTo.value=TO;
setTheme(store.get("p199-theme","light"));
if(store.get("p199-nav","0")==="1") document.body.classList.add("collapsed");
chapNav(); topStats(); chapters(); milestones(); deadline(); datatable();
const h0=location.hash.slice(1);
go(document.getElementById("v-"+h0)?h0:"chart");
window.addEventListener("resize",()=>{ if(document.getElementById("v-chart").classList.contains("on")) draw(); });
</script>
